[package]
name = "dockq"
version = "2.1.3"
edition = "2021"
description = "Rust implementation of DockQ protein docking assessment"
license = "MIT"

[lib]
name = "dockq"
path = "src/lib.rs"

[features]
profile-phases = []

[[bin]]
name = "DockQ"
path = "src/main.rs"

[dependencies]
flate2 = "1"
nalgebra = "0.33"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
